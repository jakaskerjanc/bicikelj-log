name: deploy

on:
  workflow_dispatch:
    inputs:
      resourceGroup:
        description: "Azure resource group to deploy into"
        required: true
        default: "bicikelj-rg"
      location:
        description: "Azure region (subscription policy allows only a few EU regions)"
        required: true
        default: "francecentral"
      storageAccountName:
        description: "Existing storage account name to reuse (leave blank to auto-generate a new one)"
        required: false
        default: ""

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
      - name: Register required resource providers
        run: |
          for ns in Microsoft.App Microsoft.OperationalInsights Microsoft.ManagedIdentity Microsoft.Storage Microsoft.Authorization Microsoft.Insights; do
            state=$(az provider show --namespace "$ns" --query registrationState -o tsv)
            if [ "$state" != "Registered" ]; then
              az provider register --namespace "$ns" --wait
            fi
          done
      - name: Ensure resource group exists
        run: |
          if [ "$(az group exists -n "${{ inputs.resourceGroup }}")" != "true" ]; then
            az group create -n "${{ inputs.resourceGroup }}" -l "${{ inputs.location }}"
          fi
      - name: Deploy Bicep
        env:
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
        run: |
          if [ -z "$ALERT_EMAIL" ]; then
            echo "::error::ALERT_EMAIL repo secret is not set"
            exit 1
          fi
          params=(location="${{ inputs.location }}" alertEmailAddress="$ALERT_EMAIL")
          if [ -n "${{ inputs.storageAccountName }}" ]; then
            params+=(storageAccountName="${{ inputs.storageAccountName }}")
          fi
          az deployment group create \
            -g "${{ inputs.resourceGroup }}" \
            -f infra/main.bicep \
            -p "${params[@]}"
